<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <!-- Food: orange circle with a soft shadow, a white fork on the left and a knife on the right. -->
  <circle cx="28" cy="30" r="27" fill="#000000" fill-opacity="0.18"/>
  <circle cx="28" cy="28" r="27" fill="#c2570c"/>
  <!-- Fork: tines, then the stem -->
  <path d="M18 14 V23 A3 3 0 0 0 24 23 V14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="26" x2="21" y2="42" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Knife: blade, then the handle -->
  <path d="M35 14 Q41 18 41 27 L35 27 Z" fill="#ffffff"/>
  <line x1="35" y1="27" x2="35" y2="42" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
