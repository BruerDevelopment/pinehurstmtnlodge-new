<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <!-- Ski resort: blue circle with a soft shadow and a simple white skier. -->
  <circle cx="28" cy="30" r="27" fill="#000000" fill-opacity="0.18"/>
  <circle cx="28" cy="28" r="27" fill="#1f7fc4"/>
  <!-- Head -->
  <circle cx="34" cy="15" r="3" fill="#ffffff"/>
  <!-- Torso: from the neck down and to the left -->
  <line x1="30" y1="20" x2="27" y2="26" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="27" y2="27" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs: from the hip down and to the right -->
  <line x1="27" y1="27" x2="34" y2="30" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="34" y1="30" x2="30" y2="37" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pole -->
  <line x1="27" y1="22" x2="34" y2="25" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="18" x2="34" y2="25" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <line x1="18" y1="17" x2="16.5" y2="20" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <!-- Ski: diagonal across the bottom -->
  <line x1="17" y1="36" x2="38" y2="41" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="39" y1="41" x2="41" y2="39" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
