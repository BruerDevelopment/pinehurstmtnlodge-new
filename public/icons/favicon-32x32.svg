<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Tall, multi-tier pine in a 100 x 100 box, with a trunk below. -->
    <g id="pine">
      <polygon points="50,0 68,28 60,28 80,54 70,54 92,84 62,84 62,100 38,100 38,84 8,84 30,54 20,54 40,28 32,28"/>
    </g>
  </defs>
  <!-- A thick, round-joined stroke in the same color softens the points. -->
  <use xlink:href="#pine" transform="translate(0,5) scale(0.15,0.25)" fill="#1f5a52" stroke="#1f5a52" stroke-width="8" stroke-linejoin="round"/>
  <use xlink:href="#pine" transform="translate(17,5) scale(0.15,0.25)" fill="#7d9890" stroke="#7d9890" stroke-width="8" stroke-linejoin="round"/>
  <use xlink:href="#pine" transform="translate(7,1) scale(0.19,0.29)" fill="#2f7d74" stroke="#2f7d74" stroke-width="8" stroke-linejoin="round"/>
</svg>
